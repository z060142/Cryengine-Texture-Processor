[package]
name = "texproc"
version = "2.1.0"
edition = "2021"

[dependencies]
ce-schema = { path = "../ce-schema" }
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "exr", "hdr", "tga", "bmp", "webp"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiff = "0.11"
