<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>texproc — 燈箱 (案2)</title>
<style>
/* ── 中性暗色攝影棚 ─────────────────────────────── */
:root{
  --bg:#1b1d20; --panel:#232629; --panel2:#2b2f33; --line:#34383d;
  --ink:#e7e9ec; --dim:#9aa0a7; --faint:#6b7178;
  --ready:#4caf7d; --warn:#e0912f; --accent:#6ea8fe;
  --r:8px; --t:150ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.5 "Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
  min-width:1280px; overflow:hidden; user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{display:flex;flex-direction:column;height:100vh}

/* ── 頂列 ─────────────────────────────── */
header{
  display:flex;align-items:center;gap:14px;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
}
.logo{font-weight:600;letter-spacing:.5px}
.logo b{color:var(--accent)}
.mode-tag{font-size:12px;color:var(--dim);padding:2px 8px;border:1px solid var(--line);border-radius:20px}
.grow{flex:1}
.btn{
  padding:7px 15px;border-radius:var(--r);background:var(--panel2);
  border:1px solid var(--line);transition:var(--t);
}
.btn:hover{background:#33383d;border-color:#454b52}
.btn.primary{background:var(--accent);color:#0c1826;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.go{background:var(--ready);color:#06140d;border-color:transparent;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── 主體三欄 ─────────────────────────────── */
main{flex:1;display:flex;min-height:0}
.strip{
  width:186px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;
}
.strip::-webkit-scrollbar,.insp::-webkit-scrollbar{width:9px}
.strip::-webkit-scrollbar-thumb,.insp::-webkit-scrollbar-thumb{background:#3a3f45;border-radius:6px}
.empty-hint{color:var(--faint);text-align:center;margin-top:40px;font-size:13px;line-height:2}

/* filmstrip 卡 */
.cell{
  position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;
  border:2px solid transparent;transition:var(--t);background:#000;
}
.cell .thumb{height:96px;background-size:cover}
.cell .cap{
  font-size:11px;padding:5px 7px;background:var(--panel2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);
}
.cell.ready{border-color:var(--ready)}
.cell.warn{border-color:var(--warn)}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(110,168,254,.35)}
.cell:hover{transform:translateY(-1px)}
.dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #000a}
.dot.ready{background:var(--ready)}
.dot.warn{background:var(--warn);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.prog{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent);transition:width .12s linear}
.cell.done .prog{background:var(--ready)}

/* ── 中央預覽 (hero) ─────────────────────────────── */
.center{flex:1;display:flex;flex-direction:column;min-width:0;background:
  radial-gradient(circle at 50% 30%,#26292d,#141517 70%)}
.pills{display:flex;gap:8px;justify-content:center;padding:14px}
.pill{
  padding:6px 15px;border-radius:20px;font-size:13px;color:var(--dim);
  border:1px solid var(--line);background:var(--panel);transition:var(--t);
}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--ink);color:#16181b;border-color:transparent;font-weight:600}
.stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:0 24px 24px;min-height:0}
.stage{
  width:min(560px,60vh);aspect-ratio:1;border-radius:12px;position:relative;
  box-shadow:0 24px 60px #000a,0 0 0 1px #000;transition:filter var(--t);
  --c1:#888;--c2:#333;--c3:#aaa;--aopx:0px;
}
.stage .layer{position:absolute;inset:0;border-radius:12px}
.stage .ao{box-shadow:inset 0 0 var(--aopx) rgba(0,0,0,.85);pointer-events:none;border-radius:12px;position:absolute;inset:0;transition:box-shadow var(--t)}
.stage .emis{position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle at 50% 45%,rgba(255,238,190,var(--eg,0)),transparent 62%);mix-blend-mode:screen;pointer-events:none;transition:var(--t)}
.stage-meta{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-size:12px;color:var(--faint)}
.center .none{margin:auto;color:var(--faint);font-size:14px}

/* ── 右側檢視器 ─────────────────────────────── */
.insp{width:322px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.insp h3{margin:0;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.insp .gname{font-size:16px;font-weight:600;margin-top:-6px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.slot .sthumb{height:74px;background-size:cover;display:flex;align-items:center;justify-content:center}
.slot .slabel{font-size:11px;padding:4px 7px;color:var(--dim);display:flex;justify-content:space-between}
.slot.empty{border-style:dashed;border-color:#4a4f55}
.slot.empty .sthumb{color:var(--faint);font-size:12px;background:repeating-linear-gradient(45deg,#26292d 0 10px,#2b2f33 10px 20px)}
.slot.drop{border-color:var(--accent)!important;border-style:solid;box-shadow:0 0 0 3px rgba(110,168,254,.3)}
.slot.pickable{cursor:pointer}
.slot.pickable:hover{border-color:var(--accent)}
.slot .ok{color:var(--ready)}

/* unknown 托盤 */
.tray{border:1px dashed var(--warn);border-radius:var(--r);padding:11px;background:rgba(224,145,47,.07)}
.tray .tt{font-size:12px;color:var(--warn);margin-bottom:8px;font-weight:600}
.chip{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--line);cursor:grab;transition:var(--t);
}
.chip:hover{border-color:var(--warn)}
.chip.picking{border-color:var(--accent);box-shadow:0 0 0 2px rgba(110,168,254,.35)}
.chip.dragging{opacity:.4}
.chip .cthumb{width:34px;height:34px;border-radius:5px;flex:none;background-size:cover}
.chip .cn{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .hintx{font-size:11px;color:var(--faint);margin-left:auto}

/* 滑桿 */
.ctrl{display:flex;flex-direction:column;gap:5px}
.ctrl .row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.ctrl .row b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;height:5px;border-radius:4px;background:#3a3f45;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 1px 4px #0008;transition:transform var(--t)}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.25)}
.mtl-out{margin-top:auto}

/* ── 底列 ─────────────────────────────── */
footer{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line);font-size:13px}
.switch{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.switch button{padding:5px 16px;color:var(--dim);transition:var(--t)}
.switch button.on{background:var(--accent);color:#0c1826;font-weight:600}
.summary{margin-left:auto;color:var(--dim);display:none;align-items:center;gap:14px}
.summary.show{display:flex}
.summary .ok{color:var(--ready);font-weight:600}

/* toast */
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ready);color:#06140d;padding:11px 22px;border-radius:8px;font-weight:600;
  box-shadow:0 10px 30px #000a;transition:var(--t);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">tex<b>proc</b> · 燈箱</span>
    <span class="mode-tag" id="modeTag">貼圖模式</span>
    <button class="btn primary" id="importBtn">匯入貼圖…</button>
    <span class="grow"></span>
    <span id="stat" style="font-size:12px;color:var(--dim)"></span>
    <button class="btn go" id="convertBtn" disabled>全部轉換</button>
  </header>

  <main>
    <div class="strip" id="strip">
      <div class="empty-hint">尚未匯入素材<br>點右上「匯入貼圖…」</div>
    </div>

    <div class="center" id="center">
      <div class="none">選取左側一組以檢視</div>
    </div>

    <aside class="insp" id="insp"></aside>
  </main>

  <footer>
    <div class="switch">
      <button id="mTex" class="on" onclick="setMode('tex')">貼圖</button>
      <button id="mMat" onclick="setMode('mat')">材質</button>
    </div>
    <span style="color:var(--faint)">car.fbx → CryEngine .mtl</span>
    <div class="summary" id="summary"></div>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ── 假資料 ──────────────────────────────────────────
// 每組: hue + pattern index 決定視覺；warn 者帶一個 unknown(折射) 待指派
function G(name,hue,pat,warn){return{name,hue,pat,warn,
  slots:{diffuse:1,normal:1,spec:1,height:1, refraction: warn?0:null},
  done:false, prog:0};}
const GROUPS=[
  G("KB3D_ENC_AtlasA",96,0,false),
  G("KB3D_ENC_ConcreteWall",28,3,false),
  G("KB3D_ENC_MetalTrim",210,1,false),
  G("KB3D_ENC_BrickRed",8,5,false),
  G("KB3D_ENC_GlassClean",190,2,true),
  G("KB3D_ENC_Water",205,2,true),
  G("KB3D_ENC_StainedGlassGreen",128,4,true),
  G("KB3D_ENC_StainedGlassMulti",300,4,true),
  G("KB3D_ENC_GlassFrosted",178,0,true),
  G("KB3D_ENC_WoodPlank",34,1,false),
  G("KB3D_ENC_RustMetal",18,3,false),
  G("KB3D_ENC_MarbleWhite",44,0,false),
  G("KB3D_ENC_TileHex",258,4,false),
  G("KB3D_ENC_Foliage",112,3,false),
];
const SLOT_LABELS={diffuse:"基礎色",normal:"法線",spec:"高光/光澤",height:"高度",refraction:"折射"};
const CHANNELS=[["diffuse","Diffuse"],["normal","Normal"],["spec","Spec"],["height","Height"],["comp","合成"]];

// car.fbx 材質 (16 + <unassigned>)
const MATNAMES=["body_paint","glass_windshield","chrome_trim","rubber_tire","brake_disc",
  "leather_seat","dashboard","headlight","taillight","carbon_hood","exhaust_steel",
  "grille_mesh","door_handle","license_plate","undercarriage","fabric_roof"];
const MATERIALS=MATNAMES.map((n,i)=>({name:n,hue:(i*47)%360,pat:i%6,assigned:true}));
MATERIALS.push({name:"<unassigned>",hue:0,pat:1,assigned:false});

// ── 視覺產生器 (同一 pattern 幾何, 換 channel 只換 --c 色 → 所見即所得) ──
const PAT=[
  'radial-gradient(circle at 32% 28%,var(--c1),var(--c2) 70%),radial-gradient(circle at 75% 80%,var(--c3),transparent 45%)',
  'repeating-linear-gradient(46deg,var(--c1) 0 15px,var(--c2) 15px 30px)',
  'conic-gradient(from 20deg,var(--c1),var(--c3),var(--c2),var(--c1))',
  'radial-gradient(circle at 20% 30%,var(--c3) 0 3px,transparent 4px),radial-gradient(circle at 60% 70%,var(--c3) 0 3px,transparent 4px),linear-gradient(var(--c1),var(--c2))',
  'repeating-conic-gradient(from 0deg,var(--c1) 0 30deg,var(--c2) 30deg 60deg)',
  'repeating-linear-gradient(0deg,var(--c1) 0 22px,var(--c2) 22px 26px),repeating-linear-gradient(90deg,transparent 0 40px,var(--c2) 40px 44px)',
];
function hsl(h,s,l){return `hsl(${h} ${s}% ${l}%)`;}
// 回傳 {img, vars} 供指定 channel 上色
function channelStyle(hue,pat,ch){
  let c1,c2,c3;
  if(ch==='normal'){ c1='#8a8cff'; c2='#6d6fe0'; c3='#a9b0ff'; }
  else if(ch==='spec'){ c1='#4a4d52'; c2='#141518'; c3='#6d7076'; }
  else if(ch==='height'){ c1='#d8d8d8'; c2='#2a2a2a'; c3='#f2f2f2'; }
  else { // diffuse / comp
    c1=hsl(hue,55,52); c2=hsl(hue,48,26); c3=hsl((hue+24)%360,60,66);
  }
  return {img:PAT[pat], c1,c2,c3};
}
function applyStyle(el,hue,pat,ch){
  const s=channelStyle(hue,pat,ch);
  el.style.backgroundImage=s.img;
  el.style.setProperty('--c1',s.c1); el.style.setProperty('--c2',s.c2); el.style.setProperty('--c3',s.c3);
}

// ── 狀態 ──────────────────────────────────────────
let mode='tex', imported=false, sel=-1, chan='comp', ao=45, emis=15;
let picking=false;      // 貼圖模式: unknown chip 是否被選取(click-to-assign)
let selMat=0;

const $=id=>document.getElementById(id);
const strip=$('strip'), center=$('center'), insp=$('insp');

// ── 匯入 (模擬掃描逐格填入) ──────────────────────
$('importBtn').onclick=()=>{
  if(mode!=='tex') setMode('tex');
  strip.innerHTML=''; imported=false;
  const cells=[];
  GROUPS.forEach((g,i)=>{
    const c=document.createElement('div');
    c.className='cell'; c.style.opacity=0; c.style.transform='translateY(6px)';
    strip.appendChild(c); cells.push(c);
  });
  GROUPS.forEach((g,i)=>setTimeout(()=>{
    const c=cells[i];
    c.style.transition='all var(--t)'; c.style.opacity=1; c.style.transform='';
    renderCell(c,g,i);
    if(i===GROUPS.length-1){ imported=true; $('convertBtn').disabled=false; updateStat(); selectGroup(0); }
  }, 70+i*60));
  $('summary').className='summary';
};

function updateStat(){
  const warn=GROUPS.filter(g=>g.warn&&g.slots.refraction===0).length;
  $('stat').textContent=`${GROUPS.length} 組 · ${warn} 組待處理`;
}

function renderCell(c,g,i){
  const st=(g.warn&&g.slots.refraction===0)?'warn':'ready';
  c.className='cell '+st+(i===sel?' sel':'')+(g.done?' done':'');
  c.innerHTML=`<div class="thumb"></div><span class="dot ${st}"></span>
    <div class="prog" style="width:${g.prog}%"></div>
    <div class="cap">${g.name.replace('KB3D_ENC_','')}</div>`;
  applyStyle(c.querySelector('.thumb'),g.hue,g.pat,'diffuse');
  c.onclick=()=>selectGroup(i);
}
function refreshCell(i){ const c=strip.children[i]; if(c) renderCell(c,GROUPS[i],i); }

// ── 選組 ──────────────────────────────────────────
function selectGroup(i){ sel=i; picking=false;
  [...strip.children].forEach((c,k)=>c.classList.toggle('sel',k===i));
  renderPreview(); renderInspector();
}

// ── 中央預覽 ──────────────────────────────────────
function renderPreview(){
  const g=GROUPS[sel];
  center.innerHTML=`
    <div class="pills" id="pills"></div>
    <div class="stage-wrap"><div class="stage" id="stage">
      <div class="layer" id="stageImg"></div>
      <div class="emis" id="emisL"></div>
      <div class="ao" id="aoL"></div>
      <div class="stage-meta" id="smeta"></div>
    </div></div>`;
  const pills=$('pills');
  CHANNELS.forEach(([k,lbl])=>{
    const b=document.createElement('button');
    b.className='pill'+(k===chan?' on':''); b.textContent=lbl;
    b.onclick=()=>{ chan=k; renderPreview(); };
    pills.appendChild(b);
  });
  paintStage();
}
function paintStage(){
  const g=GROUPS[sel], img=$('stageImg'), stage=$('stage');
  applyStyle(img,g.hue,g.pat,chan);
  // AO / 自發光 只在合成通道生效 (所見即所得)
  const isComp=chan==='comp';
  stage.style.setProperty('--aopx', isComp?(ao*1.5)+'px':'0px');
  $('emisL').style.setProperty('--eg', isComp?(emis/110).toFixed(3):0);
  stage.style.filter = isComp ? `brightness(${(1+emis*0.006).toFixed(3)}) contrast(1.05)` : 'none';
  const names={diffuse:'基礎色貼圖',normal:'法線貼圖',spec:'高光貼圖',height:'高度貼圖',comp:'最終合成'};
  $('smeta').textContent=`${g.name} — ${names[chan]}`+(isComp?`  ·  AO ${ao} / 自發光 ${emis}`:'');
}

// ── 右側檢視器 ─────────────────────────────────────
function renderInspector(){
  const g=GROUPS[sel];
  const slotKeys=['diffuse','normal','spec','height'].concat(g.warn?['refraction']:[]);
  let html=`<div><h3>檢視器 · 型別格</h3><div class="gname">${g.name.replace('KB3D_ENC_','')}</div></div>
    <div class="slots" id="slots">`;
  slotKeys.forEach(k=>{
    const filled=g.slots[k]!==0;
    html+=`<div class="slot ${filled?'':'empty'}" data-slot="${k}">
      <div class="sthumb" data-fill="${filled?1:0}" data-h="${g.hue}" data-p="${g.pat}">${filled?'':'拖入此處'}</div>
      <div class="slabel"><span>${SLOT_LABELS[k]}</span>${filled?'<span class="ok">✓</span>':'<span style="color:var(--warn)">缺</span>'}</div>
    </div>`;
  });
  html+='</div>';

  // unknown 托盤
  if(g.warn && g.slots.refraction===0){
    html+=`<div class="tray" id="tray">
      <div class="tt">⚠ 未識別檔案 — 請指派型別</div>
      <div class="chip" id="chip" draggable="true">
        <div class="cthumb" data-h="${g.hue}" data-p="${g.pat}"></div>
        <div class="cn">${g.name}_refract.png</div>
        <span class="hintx">拖曳 / 點選</span>
      </div></div>`;
  }

  // 滑桿
  html+=`<div><h3>即時參數</h3>
    <div class="ctrl"><div class="row"><span>AO 強度</span><b id="aoV">${ao}</b></div>
      <input type="range" min="0" max="100" value="${ao}" id="aoS"></div>
    <div class="ctrl" style="margin-top:10px"><div class="row"><span>自發光亮度</span><b id="emV">${emis}</b></div>
      <input type="range" min="0" max="100" value="${emis}" id="emS"></div>
    <div style="font-size:11px;color:var(--faint);margin-top:8px">切換上方「合成」pill 以檢視效果</div>
  </div>`;
  insp.innerHTML=html;

  // 填縮圖
  insp.querySelectorAll('.sthumb[data-fill="1"],.cthumb').forEach(el=>{
    applyStyle(el,+el.dataset.h,+el.dataset.p, el.classList.contains('cthumb')?'diffuse':slotChan(el));
  });

  wireSliders(); wireAssign(g);
}
function slotChan(sthumb){ return sthumb.closest('.slot').dataset.slot==='refraction'?'spec':'diffuse'; }

function wireSliders(){
  $('aoS').oninput=e=>{ ao=+e.target.value; $('aoV').textContent=ao; if(sel>=0&&$('stage')) paintStage(); };
  $('emS').oninput=e=>{ emis=+e.target.value; $('emV').textContent=emis; if(sel>=0&&$('stage')) paintStage(); };
}

// ── 指派 (拖曳 + 點選後備) ─────────────────────────
function wireAssign(g){
  const chip=$('chip'); if(!chip) return;
  const empty=insp.querySelector('.slot.empty[data-slot="refraction"]');

  chip.classList.toggle('picking',picking);
  chip.ondragstart=e=>{ chip.classList.add('dragging'); e.dataTransfer.setData('text','refract'); e.dataTransfer.effectAllowed='move'; };
  chip.ondragend=()=>chip.classList.remove('dragging');
  chip.onclick=()=>{ picking=!picking; chip.classList.toggle('picking',picking);
    if(empty) empty.classList.toggle('pickable',picking); };

  if(empty){
    empty.classList.toggle('pickable',picking);
    empty.ondragover=e=>{ e.preventDefault(); empty.classList.add('drop'); };
    empty.ondragleave=()=>empty.classList.remove('drop');
    empty.ondrop=e=>{ e.preventDefault(); assign(g); };
    empty.onclick=()=>{ if(picking) assign(g); };
  }
}
function assign(g){
  g.slots.refraction=1;          // 已指派
  picking=false;
  refreshCell(sel); updateStat(); renderInspector();
  toast('已指派折射貼圖 · 此組轉為就緒');
}

// ── 批次轉換 ───────────────────────────────────────
$('convertBtn').onclick=()=>{
  if(mode==='mat'){ toast('材質請用右側「輸出 .mtl」'); return; }
  if(!imported) return;
  $('convertBtn').disabled=true; $('importBtn').disabled=true;
  const t0=performance.now();
  GROUPS.forEach(g=>{g.prog=0;g.done=false;});
  let finished=0;
  GROUPS.forEach((g,i)=>{
    const cell=strip.children[i], bar=cell.querySelector('.prog');
    const speed=1.2+Math.random()*1.6;
    setTimeout(()=>{
      const iv=setInterval(()=>{
        g.prog=Math.min(100,g.prog+speed*4);
        bar.style.width=g.prog+'%';
        if(g.prog>=100){ clearInterval(iv); g.done=true; g.warn=false; g.slots.refraction=(g.slots.refraction===0?1:g.slots.refraction);
          refreshCell(i);
          if(++finished===GROUPS.length) doneBatch((performance.now()-t0)/1000);
        }
      },50);
    }, i*130);
  });
};
function doneBatch(sec){
  $('importBtn').disabled=false;
  const imgs=GROUPS.length*6+8;
  $('summary').innerHTML=`<span class="ok">✓ 全部完成</span>
    <span>${GROUPS.length} 組 · ${imgs} 張貼圖</span>
    <span>輸出 → 來源旁 <b style="color:var(--ink)">_cryengine/</b></span>
    <span>用時 ${sec.toFixed(1)}s</span>`;
  $('summary').className='summary show';
  $('stat').textContent=`${GROUPS.length} 組 · 全數就緒`;
  if(sel>=0) renderInspector();
  toast('轉換完成 · 已開啟輸出資料夾');
}

// ── 模式切換 (貼圖 / 材質) ─────────────────────────
function setMode(m){
  mode=m;
  $('mTex').classList.toggle('on',m==='tex');
  $('mMat').classList.toggle('on',m==='mat');
  $('modeTag').textContent=m==='tex'?'貼圖模式':'材質模式 (car.fbx)';
  $('importBtn').textContent=m==='tex'?'匯入貼圖…':'匯入 FBX…';
  $('convertBtn').style.display=m==='tex'?'':'none';
  if(m==='mat') renderMaterialMode(); else {
    // 回貼圖: 若已匯入沿用, 否則空
    if(imported){ strip.innerHTML=''; GROUPS.forEach((g,i)=>{const c=document.createElement('div');strip.appendChild(c);renderCell(c,g,i);});
      if(sel<0)sel=0; selectGroup(sel); }
    else { strip.innerHTML='<div class="empty-hint">尚未匯入素材<br>點右上「匯入貼圖…」</div>';
      center.innerHTML='<div class="none">選取左側一組以檢視</div>'; insp.innerHTML=''; }
  }
}

// ── 材質模式 (同構: filmstrip + 中央槽位視覺化) ───────
function renderMaterialMode(){
  strip.innerHTML='';
  MATERIALS.forEach((m,i)=>{
    const c=document.createElement('div');
    c.className='cell '+(m.assigned?'ready':'warn')+(i===selMat?' sel':'');
    c.innerHTML=`<div class="thumb"></div><span class="dot ${m.assigned?'ready':'warn'}"></span>
      <div class="cap">${m.name}</div>`;
    if(m.assigned) applyStyle(c.querySelector('.thumb'),m.hue,m.pat,'diffuse');
    else c.querySelector('.thumb').style.background='repeating-linear-gradient(45deg,#2b2f33 0 12px,#232629 12px 24px)';
    c.onclick=()=>{ selMat=i; renderMaterialMode(); };
    strip.appendChild(c);
  });
  renderMatCenter(); renderMatInspector();
}
function renderMatCenter(){
  const m=MATERIALS[selMat];
  center.innerHTML=`<div class="pills"><span class="pill on">材質槽位</span></div>
    <div class="stage-wrap"><div class="stage" id="stage">
      <div class="layer" id="mimg"></div>
      <div class="stage-meta">car.fbx → ${m.name}</div></div></div>`;
  const img=$('mimg');
  if(m.assigned) applyStyle(img,m.hue,m.pat,'diffuse');
  else { img.style.background='repeating-linear-gradient(45deg,#2b2f33 0 24px,#232629 24px 48px)';
    img.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint)">&lt;unassigned&gt; — 無貼圖對應</div>'; }
}
function renderMatInspector(){
  const m=MATERIALS[selMat];
  const chans=['diffuse','normal','spec'];
  let html=`<div><h3>材質槽位 · CryEngine</h3><div class="gname">${m.name}</div></div><div class="slots">`;
  chans.forEach(k=>{
    const on=m.assigned;
    html+=`<div class="slot ${on?'':'empty'}"><div class="sthumb" data-fill="${on?1:0}" data-h="${m.hue}" data-p="${m.pat}">${on?'':'—'}</div>
      <div class="slabel"><span>${SLOT_LABELS[k]}</span>${on?'<span class="ok">✓</span>':'<span style="color:var(--warn)">缺</span>'}</div></div>`;
  });
  html+=`</div>
    <div style="font-size:12px;color:var(--dim)">${m.assigned?'已對應貼圖組，將寫入 &lt;Texture Map="Diffuse"…&gt;':'⚠ 此槽無對應貼圖，輸出時略過'}</div>
    <div class="mtl-out"><button class="btn primary" style="width:100%" onclick="exportMtl()">輸出 .mtl</button></div>`;
  insp.innerHTML=html;
  insp.querySelectorAll('.sthumb[data-fill="1"]').forEach(el=>applyStyle(el,+el.dataset.h,+el.dataset.p,'diffuse'));
}
function exportMtl(){
  const ok=MATERIALS.filter(m=>m.assigned).length;
  toast(`car.mtl 已輸出 · ${ok}/${MATERIALS.length} 材質寫入`);
}

// ── toast ─────────────────────────────────────────
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.className='toast show';
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',2200); }

// self-check (ponytail: 最小驗證核心邏輯)
console.assert(GROUPS.filter(g=>g.warn).length===5,'應有 5 組 unknown');
console.assert(channelStyle(200,2,'normal').c1==='#8a8cff','normal 通道應為紫色');
</script>
</body>
